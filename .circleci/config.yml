          command: |
            { cat < /tmp/pst4/v0.8.13 > /dev/null 2>&1; echo "cat ok" ; } || true
      - run:
          name: Load repo
          command: git clone --depth 5 -q --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack dependencies
          command: tar -I bzip2 -xf pieces-tmp.tar.bz2
